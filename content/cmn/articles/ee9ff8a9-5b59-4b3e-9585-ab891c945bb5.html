  <div class="poem">
    <p>人生如蜿蜒小径<br>
    众多的灵魂行其上，<br>
    匆匆向前不自察，<br>
    无视那终极归向。</p>

    <p>人生多半由我们造，<br>
    直或曲，二者之一；<br>
    我们将得其应得—<br>
    永恒的失或得。</p>

    <p>哦，亲爱的灵魂！在生命之路上，<br>
    倚靠你救主的胸膛；<br>
    在那里无敌人能骚扰你，<br>
    直到你得到永恒的安息。</p>
  </div>
