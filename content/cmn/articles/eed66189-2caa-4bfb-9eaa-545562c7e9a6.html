  <div class="poem">
    <p><strong>起来欢喜吧！晨曦已现！<br>
    欢跃歌唱吧！黑夜已过，<br>
    昼光从高处照耀，<br>
    神的恩典临到人间！<br>
    欢喜赞美万王之王！<br>
    感谢且颂扬，更多恩典在此显现！</strong></p>

    <p><strong>起来荣耀主！<br>
    高举并称颂祂配得之名！<br>
    祂以爱自天而照，<br>
    从上倾洒福泽，<br>
    祂的怜悯向人伸延——<br>
    敬拜并赞美我们的全能主！</strong></p>

    <p><strong>感谢并歌颂基督我们的王<br>
    以虔诚的赞美敬拜祂；<br>
    在敬畏中俯伏拜倒——<br>
    神的圣洁就临在此处；<br>
    在奇妙的荣耀中屈膝；<br>
    崇拜万能的万王之王！</strong></p>
