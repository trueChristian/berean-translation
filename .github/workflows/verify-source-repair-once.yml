name: Verify repaired source once

on:
  push:
    branches: [feat/openai-batch-translation]
    paths:
      - .github/workflows/verify-source-repair-once.yml
      - berean_translation/**
      - tests/**
      - prompts/**
      - config/**

permissions:
  contents: read

jobs:
  compatibility:
    if: github.repository == 'trueChristian/berean-translation' && github.ref == 'refs/heads/feat/openai-batch-translation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the translation implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the official SDK and run every regression test
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          mkdir -p .build/evidence
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee .build/evidence/tests.txt
          .venv/bin/python -m berean_translation validate --recognize-human-edits
      - name: Check out only repaired English metadata and article fragments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: trueChristian/berean-voice
          ref: 62e7fd23b886a01da2755240e7a6c7ee28174bda
          path: .build/source
          sparse-checkout: content/articles
          persist-credentials: false
      - name: Verify actual source discovery and every article without OpenAI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY' | tee .build/evidence/source-http.json
          import json
          from pathlib import Path
          from berean_translation.config import Config
          from berean_translation.source import SourceClient
          config = Config(Path.cwd())
          config.runtime['source_branch'] = '62e7fd23b886a01da2755240e7a6c7ee28174bda'
          report = SourceClient(config).discover()
          print(json.dumps({'revision': report['revision'], 'issues': len(report['issues']), 'articles': len(report['articles'])}, indent=2))
          PY
          .venv/bin/python -m berean_translation.check_source --checkout .build/source --revision 62e7fd23b886a01da2755240e7a6c7ee28174bda | tee .build/evidence/source-articles.json
          git diff --exit-code
          cat .build/evidence/source-articles.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repaired-source-compatibility
          path: .build/evidence/
          include-hidden-files: true
          retention-days: 14
