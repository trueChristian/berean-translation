name: Source maintenance review once
on:
  push:
    branches: [feat/openai-batch-translation]
    paths: [.github/workflows/source-maintenance-review-once.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'trueChristian/berean-translation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Capture reviewed translation history
        run: |
          mkdir -p .build/review
          git bundle create .build/review/translation.bundle HEAD refs/remotes/origin/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: trueChristian/berean-voice
          ref: main
          path: .build/core
          fetch-depth: 0
          persist-credentials: false
      - name: Capture English work without copying images
        run: |
          set -euo pipefail
          git -C .build/core rev-parse HEAD > .build/review/core-main-revision.txt
          git -C .build/core ls-tree -r HEAD > .build/review/core-main-tree.txt
          git -C .build/core archive HEAD -- AGENTS.md README.md .gitignore .github tools tests docs index.json catalogue.json manifest.json navigation.json content > .build/review/core-main.tar
          git -C .build/core fetch origin refs/heads/agent/extract-2010-11-remnant
          git -C .build/core rev-parse FETCH_HEAD > .build/review/core-pr51-revision.txt
          git -C .build/core ls-tree -r FETCH_HEAD > .build/review/core-pr51-tree.txt
          git -C .build/core archive FETCH_HEAD -- AGENTS.md README.md .gitignore .github tools tests docs index.json catalogue.json manifest.json navigation.json content > .build/review/core-pr51.tar
          git -C .build/core diff HEAD...FETCH_HEAD --stat > .build/review/core-pr51-stat.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: index-driven-maintenance-review
          path: .build/review/
          include-hidden-files: true
          retention-days: 7
