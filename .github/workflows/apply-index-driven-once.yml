name: Apply reviewed translation-owned tracking once
on:
  push:
    branches: [feat/openai-batch-translation]
    paths: [.github/workflows/apply-index-driven-once.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'trueChristian/berean-translation' && github.ref == 'refs/heads/feat/openai-batch-translation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/openai-batch-translation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed consumer-owned fingerprint changes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p .build/edit-transport
          cat .maintenance/edits.{0,1,2,3,4,5} > .build/edits.zip
          echo '29e3ca99c696e584f4a57e1efce96c670d78ed6e1fd248a93265b6e7c95f1804  .build/edits.zip' | sha256sum -c -
          python3 -m zipfile -e .build/edits.zip .build/edit-transport
          python3 .build/edit-transport/apply.py
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee .build/edit-transport/tests.txt
          .venv/bin/python -m berean_translation validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=.build/edit-transport/paths.txt
          git commit -m 'refactor: discover English main by index and own fingerprints downstream'
          git push origin HEAD:refs/heads/feat/openai-batch-translation
          git rev-parse HEAD > .build/edit-transport/published-head.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: translation-owned-tracking-result
          path: .build/edit-transport/
          include-hidden-files: true
          retention-days: 7
