name: AI — Recover candidates

on:
  workflow_dispatch:
    inputs:
      original_campaign:
        description: "Finished original campaign ID; recovery spends only its remaining cap"
        required: true
        type: string
      previous_task_ids:
        description: "Exact not_ready task IDs from that campaign, comma-separated; no issue/language expansion"
        required: true
        type: string
      model:
        description: "Bounded correction model (saved candidate is reviewed first)"
        type: choice
        options: [gpt-5-mini, gpt-4.1-mini, gpt-4.1-nano, gpt-4.1, gpt-6-luna, gpt-6.1-sol, gpt-6-astra]
        default: gpt-5-mini
      review_model:
        description: "Independent review model"
        type: choice
        options: [gpt-5-mini, gpt-4.1-mini, gpt-4.1-nano, gpt-4.1, gpt-6-luna, gpt-6.1-sol, gpt-6-astra]
        default: gpt-5-mini
      budget_usd:
        description: "Full USD envelope permanently allocated from original remaining cap, including all stages"
        required: true
        type: string
      dry_run:
        description: "Preview exact pairs and cumulative budget math; no recovery tasks or allocations"
        type: boolean
        default: true

permissions:
  contents: write

# Immutable unique queue entries; the existing collector alone accepts budgets
# and writes mutable state under berean-translation-state-writer concurrency.
jobs:
  enqueue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Persist the exact candidate recovery request
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSLATION_OPERATION: review
          TRANSLATION_SELECTION: exact-recovery
          INPUT_ORIGINAL_CAMPAIGN: ${{ inputs.original_campaign }}
          INPUT_PREVIOUS_TASK_IDS: ${{ inputs.previous_task_ids }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_REVIEW_MODEL: ${{ inputs.review_model }}
          INPUT_BUDGET_USD: ${{ inputs.budget_usd }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 -m berean_translation enqueue-env
